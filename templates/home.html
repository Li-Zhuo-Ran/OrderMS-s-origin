{% load static %}

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'bootstrap-4.3.1-dist/css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'css/theme-modern.css' %}">
    <title>仟佰味餐厅</title>
        <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .main-container {
            background: rgba(255, 255, 255, 0.92);
            min-height: 100vh;
            padding: 20px;
            backdrop-filter: blur(15px);
            box-shadow: inset 0 0 100px rgba(102, 126, 234, 0.1);
        }

        /* 轮播图样式 */
        .carousel-section {
            margin: 30px auto;
            max-width: 800px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            border: 5px solid white;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
        }

        .carousel-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .carousel-slide.active img {
            transform: scale(1.05);
        }

        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .carousel-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid white;
        }

        .carousel-indicator.active {
            background: white;
            transform: scale(1.3);
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            font-size: 2rem;
            padding: 15px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-arrow:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-arrow.left {
            left: 15px;
        }

        .carousel-arrow.right {
            right: 15px;
        }

        .logo-section {
            text-align: center;
            padding: 40px 0 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .logo-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translate(-50%, -50%); }
            50% { transform: translate(0%, 0%); }
            100% { transform: translate(-50%, -50%); }
        }

        .logo-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px;
            position: relative;
            z-index: 1;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        .restaurant-name {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }

        .main-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
            padding: 0 10px;
        }

        .main-btn-card {
            background: white;
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: none;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .main-btn-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .btn-order::before { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-kitchen::before { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .btn-cashier::before { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .btn-review::before { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }

        .main-btn-card:hover::before {
            opacity: 0.1;
        }

        .main-btn-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .main-btn-card:active {
            transform: translateY(-4px) scale(1);
        }

        .btn-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .main-btn-card:hover .btn-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .btn-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            position: relative;
            z-index: 1;
        }

        .btn-order .btn-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-kitchen .btn-icon {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-cashier .btn-icon {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-review .btn-icon {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .secondary-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
            padding: 0 10px;
        }

        .secondary-btn-card {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border-radius: 15px;
            padding: 18px 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .secondary-btn-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
        }

        .secondary-btn-card:nth-child(1)::after { background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); }
        .secondary-btn-card:nth-child(2)::after { background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); }
        .secondary-btn-card:nth-child(3)::after { background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); }

        .secondary-btn-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .secondary-btn-card .btn-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            display: block;
        }

        .secondary-btn-card .btn-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .footer a {
            color: #ffeaa7;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .footer a:hover {
            color: #fff;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .carousel {
                height: 250px;
            }

            .carousel-arrow {
                padding: 10px 8px;
                font-size: 1.5rem;
                width: 40px;
                height: 40px;
            }

            .logo-container {
                width: 130px;
                height: 130px;
            }

            .restaurant-name {
                font-size: 1.6rem;
            }

            .main-buttons {
                gap: 15px;
            }

            .main-btn-card {
                padding: 25px 12px;
            }

            .btn-icon {
                font-size: 2.5rem;
            }

            .btn-label {
                font-size: 1rem;
            }
        }

        @media (max-width: 576px) {
            .carousel {
                height: 200px;
            }

            .carousel-section {
                margin: 20px -10px;
                border-radius: 15px;
            }

            .logo-section {
                padding: 30px 0 20px;
            }

            .logo-container {
                width: 110px;
                height: 110px;
            }

            .restaurant-name {
                font-size: 1.4rem;
            }

            .main-btn-card {
                padding: 22px 10px;
            }

            .btn-icon {
                font-size: 2.2rem;
            }

            .btn-label {
                font-size: 0.95rem;
            }

            .secondary-btn-card {
                padding: 15px 10px;
            }

            .secondary-btn-card .btn-icon {
                font-size: 1.8rem;
            }
        }
    </style>

</head>

<body class="page-home">
    <style>[v-cloak] { display: none; }</style>
    <div id="home-app" class="main-container" v-cloak>
        <div class="logo-section">
            <div class="logo-container">
                <img src="{% static 'images/qianbowei-logo.png' %}" alt="仟佰味餐厅 Logo">
            </div>
            <div class="restaurant-name">仟佰味餐厅</div>
        </div>

        <!-- 轮播图区域 -->
        <div class="carousel-section" ref="carouselSection">
            <div class="carousel">
                <div
                    class="carousel-slide"
                    v-for="(slide, index) in slides"
                    :key="slide.alt"
                    :class="{ active: index === currentSlide }"
                >
                    <img :src="slide.src" :alt="slide.alt">
                </div>
                <button class="carousel-arrow left" type="button" @click="prevSlide">❮</button>
                <button class="carousel-arrow right" type="button" @click="nextSlide">❯</button>
                <div class="carousel-indicators">
                    <div
                        v-for="(slide, index) in slides"
                        :key="slide.alt + '-indicator'"
                        class="carousel-indicator"
                        :class="{ active: index === currentSlide }"
                        @click="goToSlide(index)"
                    ></div>
                </div>
            </div>
        </div>

        <div class="main-buttons">
            <a v-for="item in mainActions" :key="item.label" :href="item.href" style="text-decoration: none;">
                <button class="main-btn-card" :class="item.className" type="button">
                    <span class="btn-icon" v-text="item.icon"></span>
                    <span class="btn-label" v-text="item.label"></span>
                </button>
            </a>
        </div>

        <div class="secondary-buttons">
            <button v-for="item in secondaryActions" :key="item.label" class="secondary-btn-card" type="button">
                <span class="btn-icon" v-text="item.icon"></span>
                <span class="btn-label" v-text="item.label"></span>
            </button>
        </div>

        <div class="footer">
            <p>Copyright © 2025 仟佰味餐厅。All Rights Reserved</p>
            <p><a href="/admin">管理后台入口</a></p>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        window.__HOME_APP_DATA__ = {
            slides: [
                { src: '{% static "images/dishes/chongqing-braised-chicken.jpg" %}', alt: '重庆鸡公煲' },
                { src: '{% static "images/dishes/gongbao_chicken.jpg" %}', alt: '宫保鸡丁' },
                { src: '{% static "images/dishes/mapo_tofu.jpg" %}', alt: '麻婆豆腐' },
            ],
            mainActions: [
                { href: '/order/', icon: '🥬', label: '点菜', className: 'btn-order' },
                { href: '/food_supplier/', icon: '👨', label: '后厨', className: 'btn-kitchen' },
                { href: '/manage/', icon: '💰', label: '收银', className: 'btn-cashier' },
                { href: '/review/list/page/', icon: '⭐', label: '评价', className: 'btn-review' },
            ],
            secondaryActions: [
                { icon: '💳', label: '充值' },
                { icon: '💰', label: '优惠' },
                { icon: '📞', label: '联系' },
            ],
        };
    </script>
    <script src="{% static 'js/vue/home-app.js' %}"></script>
    <script>
        window.initHomeApp();
    </script>
</body>


</html>
