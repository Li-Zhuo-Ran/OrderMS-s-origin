{% load static %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'bootstrap-4.3.1-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/theme-modern.css' %}">
    <title>点餐登录</title>
    <style>
        .order-login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .order-login-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }
        .order-login-head {
            background: linear-gradient(135deg, #21c86f 0%, #16a85a 100%);
            color: #fff;
            padding: 24px 22px;
        }
        .order-login-title {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .order-login-sub {
            margin: 8px 0 0 0;
            opacity: 0.9;
        }
        .order-login-body {
            padding: 22px;
        }
        .order-login-body input[type="text"],
        .order-login-body input[type="password"] {
            width: 100%;
            border: 1px solid #dce3ea;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }
        .order-login-actions {
            display: flex;
            gap: 10px;
        }
        .order-login-actions .btn {
            flex: 1;
        }
    </style>
</head>
<body class="page-order-signin">
    <div class="order-login-wrap">
        <div class="order-login-card">
            <div class="order-login-head">
                <h1 class="order-login-title">欢迎点餐</h1>
                <p class="order-login-sub">登录后即可选择菜品并下单</p>
            </div>
            <div class="order-login-body">
                <form action="/order/signin/" method="POST">
                    {% csrf_token %}
                    {{ form }}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="order-login-actions mt-3">
                        <button class="btn btn-success" type="submit">登录点餐</button>
                        <a class="btn btn-outline-secondary" href="/">返回首页</a>
                    </div>
                    <a class="btn btn-link btn-block mt-2" href="/signup/">没有账号？去注册</a>
                </form>
            </div>
        </div>
    </div>
    <script src="{% static 'js/load_form.js' %}"></script>
</body>
</html>
