{% load static%}

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'bootstrap-4.3.1-dist/css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'css/FoodSupplier.css'%}">
    <link rel="stylesheet" href="{% static 'css/theme-modern.css' %}">
    <title>智能点餐系统 - 后厨管理</title>
    <style>[v-cloak]{display:none;}</style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        a:hover {
            text-decoration: none;
        }

        /* 顶部导航栏 */
        .top-header {
            background: linear-gradient(to right, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .system-title {
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .system-title::before {
            content: '🍳';
            font-size: 1.5rem;
        }

        .status-tabs {
            display: flex;
            gap: 5px;
        }

        .status-tab {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            position: relative;
        }

        .status-tab.active {
            background: #00c853;
            color: white;
            font-weight: 600;
        }

        .status-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.2);
        }

        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4444;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
        }

        .header-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .meituan-logo {
            background: #ffd101;
            color: #000;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 筛选工具栏 */
        .filter-toolbar {
            background: white;
            padding: 15px 20px;
            margin: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-btn {
            padding: 6px 16px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn:hover {
            background: #e8e8e8;
        }

        .filter-btn.active {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }

        .filter-btn.primary {
            background: #00c853;
            color: white;
            border-color: #00c853;
        }

        .filter-btn.primary:hover {
            background: #00a844;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: #e0e0e0;
            margin: 0 10px;
        }
        
        /* 订单容器样式 */
        #orders {
            margin-top: 20px;
        }
        
        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 10px 20px;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
            z-index: 999;
        }

        .nav-btn {
            padding: 10px 30px;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .nav-btn-success {
            background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }

        .nav-btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.4);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .top-header {
                flex-wrap: wrap;
                padding: 10px 15px;
            }

            .header-left {
                flex: 1;
            }

            .status-tabs {
                width: 100%;
                margin-top: 10px;
                overflow-x: auto;
                padding-bottom: 5px;
            }

            .status-tab {
                padding: 6px 12px;
                font-size: 0.85rem;
                white-space: nowrap;
            }

            .filter-toolbar {
                margin: 10px 15px;
                padding: 12px;
            }

            .filter-group {
                flex-wrap: wrap;
            }

            .divider {
                display: none;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>

<body class="page-food-supplier">
    <div id="food-supplier-app" v-cloak>
    <form style="display:none;">{% csrf_token %}</form>
    <!-- 顶部导航栏 -->
    <div class="top-header">
        <div class="header-left">
            <div class="system-title">后厨管理系统</div>
            <div class="status-tabs">
                <button class="status-tab">待制作</button>
            </div>
        </div>
        <div class="header-right">
            <div class="header-icon">🔍</div>
            <div class="header-icon">🧹</div>
            <div class="header-icon">⚙️</div>
            <div class="header-icon">❓</div>
            <div class="user-avatar">👨‍🍳</div>
            <div class="meituan-logo">仟佰味·餐饮系统</div>
        </div>
    </div>

    <!-- 筛选工具栏 -->
    <div class="filter-toolbar">
        <div class="filter-group">
            <button class="filter-btn active">全部</button>
            <button class="filter-btn">堂食</button>
            <button class="filter-btn">外卖</button>
            <button class="filter-btn">打包</button>
        </div>
        <div class="divider"></div>
        <div class="filter-group">
            <button class="filter-btn">全部</button>
            <button class="filter-btn">催菜</button>
        </div>
        <div class="divider"></div>
        <div class="filter-group">
            <button class="filter-btn">下单时间 ▼</button>
        </div>
        <div class="divider"></div>
        <div class="filter-group">
            <button class="filter-btn">菜品</button>
            <button class="filter-btn">订单</button>
        </div>
        <div style="flex: 1;"></div>
        <button class="filter-btn">收起 ↑</button>
    </div>

    <div class="main-container">
        <!-- 订单卡片区域 -->
        <div id="orders" class="orders-grid">
            <!-- 动态填充订单卡片 -->
        </div>
        

                <!-- 底部填空区域 -->
                <div style="height:60px"></div>
                <!-- 底部导航栏 -->
                <div class="BottomNavBar NavBar row fixed-bottom border-top"
                    style="height:80px;background-color:#f7f7f7;height:60px;">
                    <div class="col-5 m-auto"></div>
                    <div class="col-4 m-auto">
                        <div class="row">
                            <div class="col">
                                <a href="/">
                                    <button class="btn btn-success btn-block">返 回</button>
                                </a>
                            </div>
                            <div class="col mr-3">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav">
        <div class="row">
            <div class="col-6"></div>
            <div class="col-6">
                <a href="/" style="text-decoration: none;">
                    <button class="nav-btn nav-btn-success btn-block">返回</button>
                </a>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.staticfile.org/jquery/3.4.0/jquery.min.js"></script>
    <script src="{% static 'js/csrf.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/bs4.pop.css' %}">
    <script src="{% static 'js/bs4.pop.js' %}"></script>
    <script src="{% static 'js/vue/food-supplier-app.js' %}"></script>



</body>

</html>
