{% load static%}

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'bootstrap-4.3.1-dist/css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'css/FoodSupplier.css'%}">
    <link rel="stylesheet" href="{% static 'css/theme-modern.css' %}">
    <title>智能点餐系统 - 后厨管理</title>
    <style>[v-cloak]{display:none;}</style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        a:hover {
            text-decoration: none;
        }

        /* 顶部导航栏 */
        .top-header {
            background: linear-gradient(to right, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .system-title {
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .system-title::before {
            content: '🍳';
            font-size: 1.5rem;
        }

        .status-tabs {
            display: flex;
            gap: 5px;
        }

        .status-tab {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            position: relative;
        }

        .status-tab.active {
            background: #00c853;
            color: white;
            font-weight: 600;
        }

        .status-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.2);
        }

        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4444;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
        }

        .header-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .meituan-logo {
            background: #ffd101;
            color: #000;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 筛选工具栏 */
        .filter-toolbar {
            background: white;
            padding: 15px 20px;
            margin: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-btn {
            padding: 6px 16px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn:hover {
            background: #e8e8e8;
        }

        .filter-btn.active {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }

        .filter-btn.primary {
            background: #00c853;
            color: white;
            border-color: #00c853;
        }

        .filter-btn.primary:hover {
            background: #00a844;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: #e0e0e0;
            margin: 0 10px;
        }
        
        /* 订单容器样式 */
        #orders {
            margin-top: 20px;
        }
        
        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 10px 20px;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
            z-index: 999;
        }

        .nav-btn {
            padding: 10px 30px;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .nav-btn-success {
            background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }

        .nav-btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.4);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .top-header {
                flex-wrap: wrap;
                padding: 10px 15px;
            }

            .header-left {
                flex: 1;
            }

            .status-tabs {
                width: 100%;
                margin-top: 10px;
                overflow-x: auto;
                padding-bottom: 5px;
            }

            .status-tab {
                padding: 6px 12px;
                font-size: 0.85rem;
                white-space: nowrap;
            }

            .filter-toolbar {
                margin: 10px 15px;
                padding: 12px;
            }

            .filter-group {
                flex-wrap: wrap;
            }

            .divider {
                display: none;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>

<body class="page-food-supplier">
    <div id="food-supplier-app" v-cloak>
        <form style="display:none;">{% csrf_token %}</form>
        <!-- 顶部导航栏 -->
        <div class="top-header">
            <div class="header-left">
                <div class="system-title">后厨管理系统（Vue.js）</div>
                <div class="status-tabs">
                    <button class="status-tab active">订单状态流转</button>
                </div>
            </div>
            <div class="header-right">
                <div class="user-avatar">👨‍🍳</div>
                <div class="meituan-logo">仟佰味·餐饮系统</div>
            </div>
        </div>

        <div class="filter-toolbar">
            <div class="filter-group">
                <button class="filter-btn active">待接单</button>
                <button class="filter-btn">已接单</button>
                <button class="filter-btn">制作中</button>
                <button class="filter-btn">待上菜</button>
                <button class="filter-btn">已上菜</button>
            </div>
        </div>

        <div class="main-container">
            <div id="orders" class="orders-grid">
                <div v-if="loading" style="text-align:center;padding:30px;color:#666;">订单加载中...</div>
                <div v-else-if="errorMessage" style="text-align:center;padding:30px;color:#d32f2f;" v-text="errorMessage"></div>
                <div v-else-if="orders.length === 0" style="text-align:center;padding:30px;color:#999;">暂无待处理订单</div>

                <div v-for="(tableOrders, tableName) in groupedOrders" :key="tableName" class="lane-section">
                    <div class="lane-header">
                        <span class="lane-title" v-text="tableName"></span>
                    </div>
                    <div class="food-grid">
                        <div
                            v-for="order in tableOrders"
                            :key="order.orderID_id + '-' + order.foodID_id"
                            class="food-card"
                        >
                            <div class="food-card-header">
                                <span class="food-order-num" v-text="'订单 #' + order.orderID_id"></span>
                                <span class="badge ml-2" :class="getStatusMeta(order.status).class" v-text="getStatusMeta(order.status).text"></span>
                            </div>
                            <div class="food-card-body">
                                <div class="food-name" v-text="order.food_name"></div>
                            </div>
                            <div class="food-card-footer">
                                <span class="food-time" v-text="'数量 ' + order.food_amount + ' 份'"></span>
                            </div>
                            <div style="padding:10px;text-align:center;">
                                <button
                                    v-if="getAction(order)"
                                    class="btn btn-primary btn-sm"
                                    style="width:100%;"
                                    @click="runAction(order)"
                                    v-text="getAction(order).label"
                                ></button>
                                <button
                                    v-else
                                    class="btn btn-secondary btn-sm"
                                    style="width:100%;cursor:default;"
                                >无可执行操作</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav">
        <div class="row">
            <div class="col-6"></div>
            <div class="col-6">
                <a href="/" style="text-decoration: none;">
                    <button class="nav-btn nav-btn-success btn-block">返回</button>
                </a>
            </div>
        </div>
    </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="{% static 'css/bs4.pop.css' %}">
    <script src="{% static 'js/bs4.pop.js' %}"></script>
    <script src="{% static 'js/vue/food-supplier-app.js' %}"></script>



</body>

</html>
