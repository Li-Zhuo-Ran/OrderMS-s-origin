{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'bootstrap-4.3.1-dist/css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'css/theme-modern.css' %}">
    <title>评价列表 - 仟佰味餐厅</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        [v-cloak] {
            display: none;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-top: 3%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .page-title {
            font-family: 'STSong', serif;
            font-weight: bold;
            color: #ff6b35;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            font-size: 2rem;
            position: relative;
            padding-bottom: 15px;
            text-align: center;
        }

        .page-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, #ff6b35, #ff9e6d);
            border-radius: 2px;
        }

        .review-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-left: 5px solid #ff9a9e;
        }

        .review-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .reviewer-name {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .review-date {
            color: #95a5a6;
            font-size: 0.85rem;
        }

        .star-rating {
            color: #f1c40f;
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
        }

        .review-comment {
            color: #34495e;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .no-reviews {
            text-align: center;
            padding: 3rem;
            color: #95a5a6;
            font-size: 1.1rem;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.15);
            color: white;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.15);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-buttons .back-btn,
        .action-buttons .refresh-btn {
            margin-bottom: 0;
            min-width: 170px;
            height: 44px;
            padding: 0 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 22px;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .main-container {
                margin-top: 2%;
                padding: 1rem;
            }

            .page-title {
                font-size: 1.5rem;
            }

            .review-card {
                padding: 1rem;
            }

            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body class="page-review-list">
    <div id="review-list-app" class="container p-0" v-cloak>
        <div class="row justify-content-center">
            <div class="col-lg-10 col-md-12 col-12">
                <div class="main-container">
                    <a href="/" class="back-btn">← 返回首页</a>

                    <h1 class="page-title">顾客评价</h1>

                    <div class="action-buttons">
                        <a href="/review/" class="back-btn">我要评价</a>
                        <button class="refresh-btn" type="button" @click="loadReviews">🔄 刷新评价</button>
                    </div>

                    <div id="reviews-container">
                        <div v-if="loading" class="no-reviews">
                            <p>加载中...</p>
                        </div>
                        <div v-else-if="reviews.length === 0" class="no-reviews">
                            <p>暂无评价，快来成为第一个评价的人吧！</p>
                        </div>
                        <div v-else>
                            <div class="review-card" v-for="review in reviews" :key="review.created_at + review.comment">
                                <div class="review-header">
                                    <span class="reviewer-name">[[ review.name || '匿名用户' ]]</span>
                                    <span class="review-date">[[ review.created_at ]]</span>
                                </div>
                                <div class="star-rating">[[ renderStars(review.rating) ]]</div>
                                <div class="review-comment">[[ review.comment ]]</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        window.__REVIEW_LIST_APP_DATA__ = {
            reviewsUrl: '/review/list/',
        };
    </script>
    <script src="{% static 'js/vue/review-list-app.js' %}"></script>
    <script>
        window.initReviewListApp();
    </script>
</body>
</html>
